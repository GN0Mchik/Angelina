<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lash Studio Booking</title>
    <!-- ИСПРАВЛЕНО: Правильный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
      :root {
        --bg-color: #faf3f3;
        --accent-color: #d4a373;
        --button-grad: linear-gradient(135deg, #e195ab, #cc6a87);
        --text-color: #4a4a4a;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        /* ИСПРАВЛЕНО: Рабочая ссылка на красивый фоновый рисунок студии */
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
          url("https://unsplash.com") no-repeat center center;
        background-size: cover;
      }

      .card {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 40px 30px;
        border-radius: 30px;
        width: 85%;
        max-width: 340px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .logo {
        font-size: 28px;
        font-weight: 300;
        color: var(--text-color);
        margin-bottom: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 13px;
        color: var(--accent-color);
        margin-bottom: 30px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .input-box {
        position: relative;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid #eee;
        border-radius: 12px;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
        background: #fff;
        color: var(--text-color);
        transition: all 0.3s ease;
      }

      button {
        width: 100%;
        padding: 16px;
        background: var(--button-grad);
        color: white;
        border: none;
        border-radius: 15px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(225, 149, 171, 0.3);
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .footer-text {
        font-size: 11px;
        color: #aaa;
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">LASHES</div>
      <div class="subtitle">Studio & Beauty</div>

      <div class="input-box">
        <input type="text" id="name" placeholder="Имя клиента" />
      </div>

      <div class="input-box">
        <input type="tel" id="phone" placeholder="+7 (___) ___--" />
      </div>

      <button id="main-button">ЗАПИСАТЬСЯ</button>

      <div class="footer-text">Perfect lashes every time</div>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.expand();

      // Автоподстановка имени из Telegram
      try {
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
              document.getElementById('name').value = tg.initDataUnsafe.user.first_name || '';
          }
      } catch (e) {
          console.error("Ошибка получения данных ТГ", e);
      }

      document.getElementById('main-button').addEventListener('click', () => {
          const name = document.getElementById('name').value.trim();
          const phone = document.getElementById('phone').value.trim();

          // ИСПРАВЛЕНО: Проверка заполнения полей с выводом уведомления в интерфейс Telegram
          if (!name || !phone) {
              tg.showAlert("Пожалуйста, заполните имя и номер телефона!");
              return;
          }

          // Собираем данные для n8n
          const data = {
              id: tg.initDataUnsafe?.user?.id || "unknown",
              name: name,
              phone: phone
          };

          // Тестовый URL вашего вебхука n8n
          const webhookUrl = 'https://maximkorotaev.app.n8n.cloud/webhook-test/f629f86a-f089-4619-a70c-296108bfaf0c';
          
          fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
          })
          .then(response => {
              if (response.ok) {
                  tg.showConfirm("Запись успешно отправлена! Закрыть приложение?", (ok) => {
                      if (ok) tg.close();
                  });
              } else {
                  tg.showAlert("Ошибка сервера n8n. Код ответа: " + response.status);
              }
          })
          .catch((error) => {
              console.error('Error:', error);
              tg.showAlert("Ошибка соединения. Убедитесь, что в n8n включен CORS (*)");
          });
      });
    </script>
  </body>
</html>
